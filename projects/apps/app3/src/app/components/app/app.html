<div
  class="console-shell"
  [class.console-shell--transitioning]="isTransitioning()"
  [attr.data-phase]="phaseLabel()"
>
  <div class="console-shell__glow console-shell__glow--cyan"></div>
  <div class="console-shell__glow console-shell__glow--amber"></div>

  <header class="command-bar">
    <a class="brand" [routerLink]="'/'">
      <span class="brand__mark">SB</span>
      <span class="brand__copy">
        <strong>Switchboard App3</strong>
        <small>Frame-first operations room</small>
      </span>
    </a>

    <nav class="command-nav" aria-label="Primary navigation">
      <a [routerLink]="'/'">Dock</a>
      <a
        [routerLink]="{
          name: 'mission',
          params: { missionId: 207 },
          query: { lane: 'thermal', zoom: 2 }
        }"
      >
        Mission 207
      </a>
      <a
        [routerLink]="{
          name: 'analysis',
          params: { missionId: 315 },
          query: { lens: 'echo', detail: 3 }
        }"
      >
        Analysis 315
      </a>
      <a [routerLink]="'/legacy'">Legacy redirect</a>
    </nav>

    <section class="status-cluster" aria-label="Navigation status">
      <div class="status-chip">
        <span>Frame</span>
        <strong>{{ activeFrame() }}</strong>
      </div>
      <div class="status-chip">
        <span>Phase</span>
        <strong>{{ phaseLabel() }}</strong>
      </div>
      <div class="status-chip status-chip--wide">
        <span>Address</span>
        <strong>{{ publicAddress() }}</strong>
      </div>
    </section>
  </header>

  <div class="transition-rail" aria-hidden="true">
    <span></span>
  </div>

  <router-outlet />
</div>
