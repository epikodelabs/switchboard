<div
  class="console-shell"
  [class.console-shell--transitioning]="isTransitioning()"
  [attr.data-phase]="phaseLabel()"
>
  <header class="command-bar">
    <a class="brand" [routerLink]="'/'">
      <span class="brand__mark">GL</span>
      <span class="brand__copy">
        <strong>General Ledger</strong>
        <small>Double-entry books</small>
      </span>
    </a>

    <nav class="command-nav" aria-label="Primary navigation">
      <a [routerLink]="{ name: 'books' }">Books</a>
      <a [routerLink]="{ name: 'journal' }">Journal</a>
      <a [routerLink]="{ name: 'trial' }">Trial balance</a>
      <a
        [routerLink]="{
          name: 'account',
          params: { accountId: 'a-1000' }
        }"
      >
        Cash
      </a>
      <a [routerLink]="{ name: 'settings' }">Settings</a>
    </nav>

    <section class="status-cluster" aria-label="Navigation status">
      <div class="status-chip">
        <span>Frame</span>
        <strong>{{ activeFrame() }}</strong>
      </div>
      <div class="status-chip">
        <span>Phase</span>
        <strong>{{ phaseLabel() }}</strong>
      </div>
      <div class="status-chip status-chip--wide">
        <span>Address</span>
        <strong>{{ publicAddress() }}</strong>
      </div>
    </section>
  </header>

  <div class="transition-rail" aria-hidden="true">
    <div class="transition-rail__mesh"></div>
    @if (hasHeaderPulse()) {
      @for (token of [currentHeaderPulseToken()]; track token) {
        <span class="transition-rail__thumb"></span>
      }
    }
  </div>

  <router-outlet />
</div>
