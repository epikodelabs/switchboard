<div
  class="ledger-shell"
  [class.ledger-shell--transitioning]="isTransitioning()"
  [attr.data-phase]="phaseLabel()"
>
  <header class="ledger-bar">
    <a class="ledger-brand" [routerLink]="'/'">
      <span class="ledger-brand__mark">L</span>
      <span class="ledger-brand__copy">
        <strong>Ledger</strong>
        <small>Frame-first budget tracker</small>
      </span>
    </a>

    <nav class="ledger-nav" aria-label="Primary navigation">
      <a [routerLink]="'/'">Dashboard</a>
      <a [routerLink]="{ name: 'account', params: { accountId: 1 } }">Checking</a>
      <a [routerLink]="{ name: 'spending', params: { accountId: 1 } }">Spending</a>
    </nav>

    <section class="ledger-status" aria-label="Navigation status">
      <div class="ledger-chip">
        <span>View</span>
        <strong>{{ activeFrame() }}</strong>
      </div>
      <div class="ledger-chip ledger-chip--wide">
        <span>Address</span>
        <strong>{{ publicAddress() }}</strong>
      </div>
    </section>
  </header>

  <div class="transition-rail" aria-hidden="true">
    <div class="transition-rail__mesh"></div>
    @if (hasHeaderPulse()) {
      @for (token of [currentHeaderPulseToken()]; track token) {
        <span class="transition-rail__thumb"></span>
      }
    }
  </div>

  <router-outlet />
</div>
